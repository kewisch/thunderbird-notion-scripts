---
name: Notion Sync

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      projects:
        type: string
        required: false
      lookback:
        type: string
        required: false

  workflow_dispatch:
    inputs:
      environment:
        type: environment
      projects:
        type: string
        description: Enter one or more projects to sync. Leave empty for all.
      lookback:
        type: string
        description: Enter lookback seconds or an ISO date/time. Leave empty for a full sync.
      dry:
        type: boolean
        description: Do a dry run

concurrency:
  group: synchronize
  cancel-in-progress: false

permissions:
  actions: read
  contents: read


jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      synchronizers: ${{ steps.generate.outputs.synchronizers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ignore-nothing-to-cache: true

      - name: uv sync
        run: uv sync --locked --all-extras --dev

      - name: Generate
        id: generate
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECTS: ${{ inputs.projects }}
        run: |
          if [ -z "${PROJECTS}" ]
          then
            echo "synchronizers=$(uv run -m mzla_notion -l -c config/sync_settings.${ENVIRONMENT}.toml | jq -R . | jq -sc .)" | tee -a $GITHUB_OUTPUT
          else
            echo "synchronizers=$(echo ${PROJECTS} | tr -s ', ' "\n\n" | jq -R . | jq -sc .)" | tee -a $GITHUB_OUTPUT
          fi

  run:
    needs: setup-matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        synchronizer: ${{ fromJson(needs.setup-matrix.outputs.synchronizers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ignore-nothing-to-cache: true

      - name: uv sync
        run: uv sync --locked --all-extras --dev

      - name: Cache Notion sync data
        uses: actions/cache@v5
        with:
          path: .cache/mzla-notion
          key: notion-sync-${{ inputs.environment }}-${{ matrix.synchronizer }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notion-sync-${{ inputs.environment }}-${{ matrix.synchronizer }}-

      - name: Get repositories
        id: get-repos
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT: ${{ matrix.synchronizer }}
          VERBOSE: ${{ runner.debug && '-vv' || '' }}
          DRY: ${{ inputs.dry && '-n' || '' }}
        run: |
          # Note: create-app-token only works with one owner, we need to cut it here
          echo 'repositories<<EOF' >> $GITHUB_OUTPUT
          uv run -m mzla_notion ${DRY} ${VERBOSE} \
            -c config/sync_settings.${ENVIRONMENT}.toml \
            --repositories ${PROJECT} | cut -d / -f 2 | tee -a $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Get app token
        id: apptoken
        if: ${{ vars.GH_APP_ID }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: thunderbird
          repositories: ${{ steps.get-repos.outputs.repositories }}

      - name: Resolve sync window
        id: lookback
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKBACK_INPUT: ${{ inputs.lookback }}
        run: |
          args=""
          if [ "${LOOKBACK_INPUT}" = "auto" ]
          then
            started_at="$(
              gh run list \
                --workflow cron.yml \
                --branch main \
                --status success \
                --limit 1 \
                --json startedAt \
                --jq '.[0].startedAt // empty'
            )"
            if [ -n "${started_at}" ]
            then
              args="--lookback ${started_at}"
            else
              args="--full-sync"
            fi
          elif [ -n "${LOOKBACK_INPUT}" ]
          then
            args="--lookback ${LOOKBACK_INPUT}"
          else
            args="--full-sync"
          fi
          echo "args=${args}" >> "$GITHUB_OUTPUT"

      - name: Synchronize
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT: ${{ matrix.synchronizer }}
          VERBOSE: ${{ runner.debug && '-vv' || '' }}
          DRY: ${{ inputs.dry && '-n' || '' }}
          SYNC_WINDOW: ${{ steps.lookback.outputs.args }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token || secrets.GH_PAT }}
          PHAB_TOKEN: ${{ secrets.PHAB_TOKEN }}
          BUGZILLA_TOKEN: ${{ secrets.BUGZILLA_TOKEN }}
          NOTION_SYNC_GITHUB_USERMAP: ${{ vars.NOTION_SYNC_GITHUB_USERMAP }}
          NOTION_SYNC_BUGZILLA_USERMAP: ${{ vars.NOTION_SYNC_BUGZILLA_USERMAP }}
        run: |
          uv run -m mzla_notion ${DRY} ${SYNC_WINDOW} ${VERBOSE} --twoway-cache \
            -c config/sync_settings.${ENVIRONMENT}.toml ${PROJECT}
